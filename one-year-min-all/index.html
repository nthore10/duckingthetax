<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One-Year Vet Minimum Outcomes — All Players · Ducking The Tax</title>
<meta name="description" content="Next-season outcomes for one-year veteran-minimum signings, 2018-19 to 2025-26 — all players.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0; background:#e9e4d9;}
  tr.dr{transition:background .15s;}
  tr.dr:hover{background:#efeade;}
</style>
</head>
<body>
<div id="dtt-nav"></div>
<script src="/nav.js"></script>
<div style="background:#e9e4d9; padding:40px; overflow-x:auto; display:flex; justify-content:center; font-family:'Archivo',sans-serif;">
  <div id="card" style="background:#f6f3ec; border-radius:3px; box-shadow:0 1px 4px rgba(0,0,0,.10); padding:50px 54px; width:100%; min-width:1080px; max-width:1220px;"></div>
</div>
<div id="omt-tip" style="position:fixed; z-index:60; pointer-events:none; display:none; background:oklch(1 0 0); border:1px solid #dcd4c2; border-left:3px solid #8a7f6a; border-radius:6px; padding:7px 11px; font:600 12px 'IBM Plex Mono',monospace; color:#3a352c; white-space:nowrap; box-shadow:0 8px 20px -8px rgba(0,0,0,.3);"></div>
<script>
(function () {
  const CL = {
    grey:'oklch(0.7 0.02 70)', terra:'oklch(0.6 0.11 62)', teal:'oklch(0.5 0.10 165)',
    tMin:'oklch(0.74 0.05 62)', t5:'oklch(0.61 0.11 62)', t510:'oklch(0.53 0.10 168)', t10:'oklch(0.42 0.085 178)', n:'#8a7f6a',
  };

  const PAGE = {
    index: '01',
    kicker: 'One-Year Veteran Minimum · Totals · All Players',
    title: 'One Year Vet Minimums — Next-Season Outcomes',
    subtitle: '// Every player who signed a one-year veteran-minimum contract, 2018–19 to 2025–26, and what happened the following season.',
    headerLabel: 'Total 1-year minimums signed',
    N: 214,
    nArr: [24,18,23,31,27,29,33,29],
    dest: [
      { label:'Out of league at start of next year', arr:[15,9,10,17,12,13,17,15], color:CL.grey },
      { label:'New team', arr:[5,4,7,10,11,7,11,4], color:CL.terra },
      { label:'Same team', arr:[4,5,6,4,4,9,5,10], color:CL.teal },
    ],
    tiers: [
      { label:'One-year minimum', arr:[4,5,7,8,8,8,11,7], color:CL.tMin },
      { label:'Above min, below $5M', arr:[4,3,5,1,6,4,3,2], color:CL.t5 },
      { label:'$5M – $10M', arr:[1,1,0,5,0,4,1,3], color:CL.t510 },
      { label:'$10M+', arr:[0,0,1,0,1,0,1,2], color:CL.t10 },
    ],
    kpis: [
      { num:'214', label:'Minimums signed, 8 seasons', color:'#191c21' },
      { num:'50%', label:'Out of the league next year', color:CL.terra },
      { num:'28%', label:'Signed with a new team', color:'#3a352c' },
      { num:'22%', label:'Re-signed with same team', color:CL.teal },
    ],
  };

  // ================= shared build (identical on both pages) =================
  const seasons = ["'18-19","'19-20","'20-21","'21-22","'22-23","'23-24","'24-25","'25-26"];
  const fullSeasons = ['2018-19','2019-20','2020-21','2021-22','2022-23','2023-24','2024-25','2025-26'];
  const sw = 150, sh = 34, spx = 6, spy = 7;
  const wash = (color, a) => `color-mix(in oklab, ${color} ${Math.round(a*100)}%, transparent)`;
  const att = (s) => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
  function spark(arr) {
    const mn = Math.min(...arr), mx = Math.max(...arr), L = arr.length;
    const sx = (i) => spx + i*((sw-2*spx)/(L-1));
    const sy = (v) => mx===mn ? sh/2 : (sh-spy) - ((v-mn)/(mx-mn))*(sh-2*spy);
    const path = arr.map((v,i) => `${i?'L':'M'} ${sx(i).toFixed(1)} ${sy(v).toFixed(1)}`).join(' ');
    const area = path + ` L ${sx(L-1).toFixed(1)} ${sh} L ${sx(0).toFixed(1)} ${sh} Z`;
    return { path, area, ex:sx(L-1), ey:sy(arr[L-1]) };
  }
  const returnersN = PAGE.N - PAGE.dest[0].arr.reduce((a,b) => a+b, 0);

  function makeRow(o) {
    const mx = Math.max(...o.arr);
    const cells = o.arr.map((v, i) => ({
      v, s:i, bg: v>0 ? wash(o.color, 0.06 + 0.20*(v/mx)) : 'transparent',
      weight: (v===mx && mx>0) ? '700' : '500', color: v===0 ? '#cabfa8' : ((v===mx && mx>0) ? '#191c21' : '#3a352c'),
    }));
    const total = o.arr.reduce((a,b) => a+b, 0);
    const pct = o.pct != null ? o.pct : Math.round(total/o.denom*100);
    return { label:o.label, cells, total, spark:spark(o.arr), color:o.color, washFill:wash(o.color,0.10),
      sharePct:pct, shareLabel:pct+'%', mpad:'22px', mweight:o.strong?'600':'500', mcolor:o.strong?'#191c21':'#6f665a' };
  }

  const sparkSvg = (sp, color, washFill) =>
    `<svg viewBox="0 0 ${sw} ${sh}" width="${sw}" height="${sh}" style="display:block; overflow:visible;"><path d="${sp.area}" fill="${washFill}" stroke="none"></path><path d="${sp.path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="${sp.ex}" cy="${sp.ey}" r="2.7" fill="#f6f3ec" stroke="${color}" stroke-width="2"></circle></svg>`;
  const shareCell = (pct, label, color) =>
    `<div style="display:flex; align-items:center; gap:9px;"><div style="position:relative; width:88px; height:7px; border-radius:3px; background:#e6e0d3; flex:none;"><div style="position:absolute; left:0; top:0; height:100%; width:${pct}%; background:${color}; border-radius:3px;"></div></div><span style="font:600 12px 'IBM Plex Mono',monospace; color:#7d7464; min-width:34px;">${label}</span></div>`;
  const tipFor = (i, rowLabel, v) => att(`${fullSeasons[i]} · ${rowLabel} · ${v} ${v===1?'player':'players'}`);

  function headerRowHtml(h) {
    const cells = h.cells.map((c, i) =>
      `<td data-tip="${tipFor(i, PAGE.headerLabel, c)}" data-tc="${CL.n}" style="padding:13px 8px; text-align:right; font:700 13.5px 'IBM Plex Mono',monospace; color:#191c21; background:#eee7d9; border-bottom:2px solid #cfc7b6;">${c}</td>`).join('');
    return `<tr>
      <td style="padding:13px 10px 13px 0; background:#eee7d9; border-bottom:2px solid #cfc7b6; white-space:nowrap;"><span style="display:inline-flex; align-items:center; gap:9px; font:700 14.5px 'Archivo',sans-serif; color:#191c21;"><span style="width:10px; height:10px; border-radius:2px; background:${CL.n}; flex:none;"></span>${PAGE.headerLabel}</span></td>
      ${cells}
      <td style="padding:13px 10px; text-align:right; font:800 14px 'IBM Plex Mono',monospace; color:#191c21; background:#eee7d9; border-bottom:2px solid #cfc7b6;">${PAGE.N}</td>
      <td style="padding:13px 12px; background:#eee7d9; border-bottom:2px solid #cfc7b6;">${shareCell(100, '100%', CL.n)}</td>
      <td style="padding:8px 0 8px 12px; background:#eee7d9; border-bottom:2px solid #cfc7b6;">${sparkSvg(h.spark, CL.n, wash(CL.n,0.10))}</td>
    </tr>`;
  }
  function dataRowHtml(r) {
    const cells = r.cells.map((c) =>
      `<td data-tip="${tipFor(c.s, r.label, c.v)}" data-tc="${r.color}" style="padding:10px 8px; text-align:right; font-family:'IBM Plex Mono',monospace; font-size:13.5px; font-weight:${c.weight}; color:${c.color}; background:${c.bg}; border-bottom:1px solid #e3ddd1;">${c.v}</td>`).join('');
    return `<tr class="dr">
      <td style="padding:11px 10px 11px ${r.mpad}; text-align:left; border-bottom:1px solid #e3ddd1; white-space:nowrap;"><span style="display:inline-flex; align-items:center; gap:9px; font-family:'Archivo',sans-serif; font-weight:${r.mweight}; font-size:13.5px; color:${r.mcolor};"><span style="width:9px; height:9px; border-radius:2px; background:${r.color}; flex:none;"></span>${r.label}</span></td>
      ${cells}
      <td style="padding:10px 10px; text-align:right; font:700 13.5px 'IBM Plex Mono',monospace; color:#a9534a; border-bottom:1px solid #e3ddd1;">${r.total}</td>
      <td style="padding:10px 12px; border-bottom:1px solid #e3ddd1;">${shareCell(r.sharePct, r.shareLabel, r.color)}</td>
      <td style="padding:8px 0 8px 12px; border-bottom:1px solid #e3ddd1;">${sparkSvg(r.spark, r.color, r.washFill)}</td>
    </tr>`;
  }

  const header = { spark: spark(PAGE.nArr), cells: PAGE.nArr };
  const destRows = PAGE.dest.map((d) => makeRow({ ...d, denom:PAGE.N, strong:true }));
  const tierRows = PAGE.tiers.map((t) => makeRow({ ...t, denom:returnersN }));

  const kpisHtml = PAGE.kpis.map((k) =>
    `<div style="flex:1; padding:18px 24px; border-left:1px solid #e3ddd1;"><div style="font:800 34px/1 'Archivo',sans-serif; color:${k.color}; letter-spacing:-.02em;">${k.num}</div><div style="font:500 10px/1.4 'IBM Plex Mono',monospace; letter-spacing:.06em; text-transform:uppercase; color:#7d7464; margin-top:9px;">${k.label}</div></div>`).join('');
  const seasonTh = seasons.map((s) =>
    `<th style="padding:0 8px 9px; text-align:right; font:600 10px 'IBM Plex Mono',monospace; letter-spacing:.03em; color:#7d7464; border-bottom:1.5px solid #cfc7b6; white-space:nowrap;">${s}</th>`).join('');
  const caption = (txt) => `<tr><td colspan="12" style="padding:16px 0 7px; font:600 10px 'IBM Plex Mono',monospace; letter-spacing:.14em; text-transform:uppercase; color:#a9534a;">${txt}</td></tr>`;

  document.getElementById('card').innerHTML = `
    <div style="font:600 13px 'IBM Plex Mono',monospace; letter-spacing:.1em; color:#c3bdb0;">${PAGE.index}</div>
    <div style="font:600 12px 'IBM Plex Mono',monospace; letter-spacing:.18em; text-transform:uppercase; color:#a9534a; margin-top:6px;">${PAGE.kicker}</div>
    <h1 style="font:800 34px/1.1 'Archivo',sans-serif; color:#191c21; letter-spacing:-.015em; margin:8px 0 0;">${PAGE.title}</h1>
    <div style="font:400 14px/1.5 'Archivo',sans-serif; color:#6f665a; margin-top:10px; max-width:820px;">${PAGE.subtitle}</div>
    <div style="display:flex; margin-top:28px; border-top:1px solid #e3ddd1; border-bottom:1px solid #e3ddd1;">${kpisHtml}</div>
    <table style="width:100%; border-collapse:collapse; margin-top:28px;">
      <thead><tr>
        <th style="padding:0 10px 9px 0; text-align:left; font:600 10px 'IBM Plex Mono',monospace; letter-spacing:.1em; text-transform:uppercase; color:#7d7464; border-bottom:1.5px solid #cfc7b6;">Outcome</th>
        ${seasonTh}
        <th style="padding:0 10px 9px; text-align:right; font:600 10px 'IBM Plex Mono',monospace; letter-spacing:.1em; text-transform:uppercase; color:#a9534a; border-bottom:1.5px solid #cfc7b6;">Total</th>
        <th style="padding:0 12px 9px; text-align:left; font:600 10px 'IBM Plex Mono',monospace; letter-spacing:.1em; text-transform:uppercase; color:#7d7464; border-bottom:1.5px solid #cfc7b6;">Share</th>
        <th style="padding:0 0 9px 12px; text-align:left; font:600 10px 'IBM Plex Mono',monospace; letter-spacing:.1em; text-transform:uppercase; color:#7d7464; border-bottom:1.5px solid #cfc7b6;">Trend</th>
      </tr></thead>
      <tbody>
        ${headerRowHtml(header)}
        ${caption('Next-season destination — share of the n = ' + PAGE.N + ' above')}
        ${destRows.map(dataRowHtml).join('')}
        ${caption('Of ' + returnersN + ' players who were under contract at start of next season — next-year salary')}
        ${tierRows.map(dataRowHtml).join('')}
      </tbody>
    </table>
    <div style="border-top:1px solid #e3ddd1; margin-top:22px; padding-top:14px;"><div style="font:400 12px/1.5 'Archivo',sans-serif; color:#a89d8a;">Total minimums (n) is the denominator. The three destination rows — out of league, new team, same team — are a subset of it and sum to each season's total. The four salary tiers break down only the players who returned (new + same team), so their share is of returners. Cell shading scales across each row and the peak season is bold. Source: One Year Vet Min Research — Totals.</div></div>`;

  // ---- cell tooltips ----
  const tip = document.getElementById('omt-tip');
  const card = document.getElementById('card');
  const posTip = (e) => { tip.style.left = e.clientX + 'px'; tip.style.top = (e.clientY - 14) + 'px'; tip.style.transform = 'translate(-50%, -100%)'; };
  card.addEventListener('mouseover', (e) => { const c = e.target.closest('[data-tip]'); if (!c) return; tip.textContent = c.getAttribute('data-tip'); tip.style.borderLeftColor = c.getAttribute('data-tc'); tip.style.display = 'block'; posTip(e); });
  card.addEventListener('mousemove', (e) => { if (tip.style.display === 'block') posTip(e); });
  card.addEventListener('mouseout', (e) => { if (e.target.closest('[data-tip]')) tip.style.display = 'none'; });
})();
</script>
</body>
</html>
