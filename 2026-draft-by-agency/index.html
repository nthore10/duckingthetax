<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who Reps the 2026 Draft Class · Ducking The Tax</title>
<meta name="description" content="The 2026 NBA Draft top-60 big board sorted by agency — how many prospects each represents and how many project inside the top 30.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="/agency-logos.js"></script>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:oklch(0.972 0.008 85); font-family:'Archivo',system-ui,sans-serif; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;}
</style>
</head>
<body>
<div id="dtt-nav"></div>
<script src="/nav.js"></script>
<div id="stage-wrap" style="overflow:hidden; padding:24px 16px; color:oklch(0.26 0.012 65);">
  <div id="stage" style="width:1080px; margin:0 auto; padding:46px 40px; transform-origin:top left; will-change:transform;"></div>
</div>
<script>
(function () {
  const INK = 'oklch(0.24 0.012 65)';

  // name, total, top30, brand color, logo id
  const AGENCIES = [
    { id:'lift', name:'LIFT',      total:9, top30:4, color:'oklch(0.66 0.13 205)', logo:'lift' },
    { id:'team', name:'The Team',  total:7, top30:3, color:'oklch(0.34 0.024 60)', logo:'team' },
    { id:'wme',  name:'WME',       total:6, top30:4, color:'oklch(0.26 0.005 250)', logo:'wme' },
    { id:'caa',  name:'CAA',       total:5, top30:4, color:'oklch(0.57 0.2 27)',   logo:'caa' },
    { id:'exc',  name:'Excel',     total:5, top30:3, color:'oklch(0.47 0.006 250)', logo:'exc' },
    { id:'pri',  name:'Priority',  total:5, top30:1, color:'oklch(0.65 0.17 47)',  logo:'pri' },
    { id:'ger',  name:'Gersh',     total:4, top30:0, color:'oklch(0.42 0.13 256)', logo:'ger' },
    { id:'klu',  name:'Klutch',    total:3, top30:3, color:'oklch(0.68 0.1 85)',   logo:'klu' },
    { id:'oct',  name:'Octagon',   total:2, top30:1, color:'oklch(0.63 0.19 6)',   logo:'oct' },
    { id:'life', name:'Life',      total:2, top30:0, color:'oklch(0.45 0.06 180)', logo:'life' },
    { id:'next', name:'NEXT',      total:2, top30:0, color:'oklch(0.5 0.2 25)',    logo:'next' },
  ];
  const MAX_TOTAL = 9, BAR_PX = 540, UNIT = BAR_PX / MAX_TOTAL;
  const LOGOS = window.AGENCY_LOGOS || {};
  const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  const rowsHtml = AGENCIES.map((a, i) => {
    const logoUrl = LOGOS[a.logo];
    const hasLogo = !!logoUrl;
    const chip = hasLogo
      ? `<img src="${logoUrl}" alt="" style="width:100%; height:100%; object-fit:cover; display:block;">`
      : `<span style="font-family:'Archivo',sans-serif; font-size:12px; font-weight:700; color:oklch(0.45 0.012 65);">${esc(a.name[0])}</span>`;
    const faintBg = a.color.replace(')', ' / 0.1)');
    const outlineW = Math.round(a.total * UNIT * 10) / 10;
    const fillW = Math.round(a.top30 * UNIT * 10) / 10;
    const topLabel = a.top30 > 0
      ? `<span style="font-size:12.5px; font-weight:700; color:#fff; padding-right:8px; font-variant-numeric:tabular-nums;">${a.top30}</span>`
      : '';
    return `<div style="display:flex; align-items:center; height:46px;">
      <div style="width:24px; flex:none; font-size:12px; font-weight:600; color:oklch(0.66 0.012 65); font-variant-numeric:tabular-nums; text-align:right;">${i + 1}</div>
      <div style="width:184px; flex:none; display:flex; align-items:center; gap:10px; padding-left:14px;">
        <div style="width:28px; height:28px; border-radius:7px; overflow:hidden; flex:none; background:${hasLogo ? 'oklch(0.97 0.008 85)' : 'oklch(0.9 0.012 80)'}; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 1px oklch(0.26 0.012 65 / 0.12);">${chip}</div>
        <span style="flex:1; min-width:0; font-size:14px; font-weight:600; letter-spacing:-0.005em; color:${INK}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc(a.name)}</span>
      </div>
      <div style="flex:1; position:relative; height:100%; display:flex; align-items:center;">
        <div title="${a.top30} of ${a.total} project top 30" style="position:relative; flex:none; height:26px; width:${outlineW}px; border:1.5px solid ${a.color}; border-radius:4px; background:${faintBg}; overflow:hidden;">
          <div style="position:absolute; left:-1.5px; top:-1.5px; bottom:-1.5px; width:${fillW}px; background:${a.color}; border-radius:4px; display:flex; align-items:center; justify-content:flex-end;">${topLabel}</div>
        </div>
        <span style="margin-left:11px; font-size:15px; font-weight:700; color:${INK}; font-variant-numeric:tabular-nums; flex:none;">${a.total}</span>
      </div>
    </div>`;
  }).join('');

  document.getElementById('stage').innerHTML = `
    <div style="display:flex; align-items:baseline; justify-content:space-between; border-bottom:1.5px solid oklch(0.26 0.012 65 / 0.85); padding-bottom:13px;">
      <div style="font-size:11.5px; font-weight:700; letter-spacing:0.22em; text-transform:uppercase; color:oklch(0.26 0.012 65); white-space:nowrap;">2026 NBA Draft · Big Board</div>
      <div style="font-size:11.5px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:oklch(0.52 0.012 65); white-space:nowrap;">Top 60 Prospects</div>
    </div>
    <header style="margin-top:24px;">
      <h1 style="font-family:'Newsreader',serif; font-weight:500; font-size:46px; line-height:1.02; letter-spacing:-0.015em; margin:0; color:oklch(0.21 0.012 65);">Who Reps the 2026 Class</h1>
      <p style="font-family:'Newsreader',serif; font-size:18px; line-height:1.45; color:oklch(0.4 0.012 65); margin:13px 0 0; max-width:700px;">The top 60 prospects on the board, sorted by the agency that represents them. The outlined bar counts every prospect; the filled portion is how many project inside the top 30.</p>
    </header>
    <div style="display:flex; align-items:center; gap:26px; margin-top:22px; padding-bottom:14px; border-bottom:1px solid oklch(0.26 0.012 65 / 0.16);">
      <div style="display:flex; align-items:center; gap:9px;">
        <div style="width:34px; height:18px; border-radius:3px; border:1.5px solid oklch(0.45 0.012 65); background:oklch(0.45 0.012 65 / 0.1);"></div>
        <span style="font-size:12px; font-weight:600; letter-spacing:0.04em; color:oklch(0.42 0.012 65); text-transform:uppercase;">TOTAL IN PROJECTED TOP 60</span>
      </div>
      <div style="display:flex; align-items:center; gap:9px;">
        <div style="width:34px; height:18px; border-radius:3px; background:oklch(0.45 0.012 65);"></div>
        <span style="font-size:12px; font-weight:600; letter-spacing:0.04em; color:oklch(0.42 0.012 65); text-transform:uppercase;">Projected top 30</span>
      </div>
      <div style="margin-left:auto; font-family:'Newsreader',serif; font-style:italic; font-size:15px; color:oklch(0.5 0.012 65);">21 agencies · 60 prospects&nbsp;</div>
    </div>
    <div style="margin-top:8px;">${rowsHtml}</div>
    <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:30px; margin-top:18px; padding-top:16px; border-top:1px solid oklch(0.26 0.012 65 / 0.18);">
      <p style="font-size:12px; line-height:1.5; color:oklch(0.55 0.012 65); margin:0; max-width:600px;">Agencies with two or more prospects shown. Ten more agencies hold a single prospect apiece</p>
      <p style="font-size:12px; margin:0;"><br></p>
    </div>`;

  // ---- fit the 1080px stage to the container width ----
  const wrap = document.getElementById('stage-wrap');
  const stage = document.getElementById('stage');
  function fit() {
    const avail = stage.parentElement.clientWidth - 32;
    const s = Math.min(1, avail / 1080);
    stage.style.transform = 'scale(' + s + ')';
    wrap.style.height = (stage.offsetHeight * s + 48) + 'px';
  }
  window.addEventListener('resize', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  setTimeout(fit, 350);
  fit();
})();
</script>
</body>
</html>
