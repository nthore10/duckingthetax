<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ad Hoc Research · Ducking The Tax</title>
<meta name="description" content="One-off visualizations and data deep-dives from Ducking The Tax — interactive versions of the charts featured in the blog.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg-base:#1E2228;--bg-raised:#252A31;--accent:#00D89A;
    --text-bright:#F2F4F7;--text-primary:#C8D1DC;--text-muted:#9AA6B4;--text-dim:#7A8694;
    --border:#2E343D;
    --font-display:'Space Grotesk',sans-serif;--font-mono:'Space Mono',monospace;
  }
  html{background:var(--bg-base);color:var(--text-primary);font-family:var(--font-mono);}
  body{min-height:100vh;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:760px;margin:0 auto;padding:96px 24px;text-align:center;}
  .kicker{font-family:var(--font-mono);font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);}
  h1{font-family:var(--font-display);font-weight:700;font-size:40px;letter-spacing:-0.5px;color:var(--text-bright);margin:14px 0 0;}
  .lede{font-family:var(--font-mono);font-size:14px;line-height:1.7;color:var(--text-muted);margin:18px auto 0;max-width:560px;}
  .divider{width:40px;height:3px;background:var(--accent);border-radius:2px;margin:34px auto 0;}
  .note{font-family:var(--font-mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);margin-top:34px;}
  .cta{display:inline-block;margin-top:14px;padding:10px 18px;border:1px solid var(--border);border-radius:6px;
    font-family:var(--font-mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);
    transition:color .15s,border-color .15s,background .15s;}
  .cta:hover{color:var(--text-bright);border-color:var(--accent);background:var(--bg-raised);}
</style>
</head>
<body>
<div id="dtt-nav"></div>
<script src="/nav.js"></script>
<div class="wrap">
  <div class="kicker">Ad Hoc Research</div>
  <h1>Coming Soon</h1>
  <div class="divider"></div>
  <p class="lede">One-off visualizations and data deep-dives from the blog will live here — the fully interactive versions, with the sorting, tooltips, and filtering the static blog embeds can&rsquo;t show.</p>
  <div class="note">New charts land here as they&rsquo;re published</div>
  <a class="cta" href="https://duckingthetax.substack.com" target="_blank" rel="noopener">Read the blog &rarr;</a>
</div>
</body>
</html>
